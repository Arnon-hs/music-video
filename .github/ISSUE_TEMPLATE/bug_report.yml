name: Bug report
description: Report a reproducible problem in the repository code or CLI.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include API keys, credentials, private media, or unreleased model files.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest command sequence that reproduces the problem.
      placeholder: |
        ./music-video doctor
        ./music-video generate ... --dry-run
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Python version, backend, and relevant tool versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Paste only the relevant lines after removing secrets and private paths.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets, credentials, and private media from this report.
          required: true
        - label: This is not a confidential security vulnerability.
          required: true
